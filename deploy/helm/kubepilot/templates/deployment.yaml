apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kubepilot
  labels:
    app: kubepilot
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: kubepilot
  template:
    metadata:
      labels:
        app: kubepilot
    spec:
      containers:
        - name: kubepilot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: {{ .Values.config.llmProvider | quote }}
            - name: MODEL_NAME
              value: {{ .Values.config.modelName | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.config.ollamaBaseUrl | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            - name: LOKI_URL
              value: {{ .Values.config.lokiUrl | quote }}
            - name: REQUIRE_APPROVAL
              value: {{ .Values.config.requireApproval | quote }}
            - name: READ_ONLY
              value: {{ .Values.config.readOnly | quote }}
          {{- if .Values.existingSecret }}
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: google-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: openai-api-key
                  optional: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
